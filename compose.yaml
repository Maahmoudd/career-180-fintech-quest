services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: revenue_ledger
      DB_USERNAME: ledger
      DB_PASSWORD: ledger
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MOCK_PROVIDER_PATH: /var/www/html/storage/app/private/mock-provider.sqlite
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/composer-cache
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_started
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: revenue_ledger
      DB_USERNAME: ledger
      DB_PASSWORD: ledger
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MOCK_PROVIDER_PATH: /var/www/html/storage/app/private/mock-provider.sqlite
    volumes:
      - .:/var/www/html
    command: php artisan queue:work redis --sleep=1 --tries=5 --timeout=60

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_started
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: revenue_ledger
      DB_USERNAME: ledger
      DB_PASSWORD: ledger
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: revenue_ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uledger", "-pledger"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  composer-cache:
